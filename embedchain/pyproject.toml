[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embedchain"
version = "0.2.0"
description = "Simplest open source retrieval (RAG) framework"
authors = [
    { name = "Taranjeet Singh", email = "taranjeet@embedchain.ai" },
    { name = "Deshraj Yadav", email = "deshraj@embedchain.ai" },
]
maintainers = [
    { name = "Cadence Agyirey", email = "8145742+cagyirey@users.noreply.github.com" }
]
license = "Apache-2.0"

readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    # Core framework
    "langchain>=1.0.0,<2.0.0",
    "langchain-community>=0.4.0,<2.0.0",
    "langchain-text-splitters>=1.0.0,<2.0.0",

    # Utilities
    "requests>=2.31.0,<3.0.0",
    "beautifulsoup4>=4.12.2,<5.0.0",
    "pypdf>=6.0.0,<7.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "rich>=14.0.0,<15.0.0",
    "pysbd>=0.3.4,<1.0.0",
    "schema>=0.7.5,<1.0.0",
    "sqlalchemy>=2.0.27,<3.0.0",
    "alembic>=1.13.1,<2.0.0",
    "validators>=0.22.0",

    # Telemetry
    "posthog>=3.0.2,<6.0.0",  # chromadb requires <6.0.0

    # Memory (imported at module level in app.py)
    "mem0ai>=1.0.0,<2.0.0",

    # Cache (imported at module level in cache.py)
    "gptcache>=0.1.43,<1.0.0",
]

[project.optional-dependencies]
# === LLM PROVIDERS ===
openai = ["langchain-openai>=1.0.0"]
anthropic = ["langchain-anthropic>=1.0.0"]
cohere = ["langchain-cohere>=0.4.0"]
google = ["google-generativeai>=0.3.0,<1.0.0"]
mistral = ["langchain-mistralai>=0.3.0"]
together = ["together>=1.2.1,<2.0.0"]  # langchain-together not yet updated for langchain 1.0
ollama = ["langchain-ollama>=0.4.0"]
aws = ["langchain-aws>=1.0.0"]
vertexai = ["langchain-google-vertexai>=3.0.0"]
groq = ["langchain-groq>=0.3.0"]
nvidia = ["langchain-nvidia-ai-endpoints>=0.4.0"]
replicate = ["replicate>=1.0.0,<2.0.0"]
llama2 = ["replicate>=1.0.0,<2.0.0"]  # Alias for backward compatibility

# === EMBEDDERS ===
huggingface = ["langchain-huggingface>=0.2.0", "sentence-transformers>=5.0.0,<6.0.0"]
opensource = [
    "sentence-transformers>=5.0.0,<6.0.0",
    "torch>=2.3.0,<3.0.0",
    "gpt4all>=2.0.2,<3.0.0",
]

# === VECTOR STORES ===
chromadb = ["chromadb>=1.4.0,<2.0.0"]
pinecone = ["pinecone>=8.0.0,<9.0.0", "pinecone-text>=0.9.0"]
qdrant = ["qdrant-client>=1.6.3,<2.0.0"]
weaviate = ["weaviate-client>=4.19.0,<5.0.0"]
elasticsearch = ["elasticsearch>=9.0.0,<10.0.0"]
opensearch = ["opensearch-py>=3.0.0,<4.0.0"]
milvus = ["pymilvus>=2.6.0,<3.0.0"]
lancedb = ["lancedb>=0.6.2,<1.0.0", "pyarrow>=22.0.0,<23.0.0"]
postgres = [
    "psycopg>=3.1.12,<4.0.0",
    "psycopg-binary>=3.1.12,<4.0.0",
    "psycopg-pool>=3.1.8,<4.0.0",
]
mysql = ["mysql-connector-python>=9.0.0,<10.0.0"]

# === DATA LOADERS ===
audio = ["deepgram-sdk>=5.0.0"]
youtube = ["youtube-transcript-api>=0.6.0", "pytube>=15.0.0"]
github = ["PyGithub>=1.59.1", "gitpython>=3.1.38"]
slack = ["slack-sdk>=3.21.0"]
discord = ["discord.py>=2.3.0"]
dropbox = ["dropbox>=12.0.0"]
google-services = [
    "google-api-python-client>=2.111.0,<3.0.0",
    "google-auth>=2.25.2,<3.0.0",
    "google-auth-oauthlib>=1.2.0,<2.0.0",
    "google-auth-httplib2>=0.2.0,<1.0.0",
]
unstructured = ["unstructured>=0.14.0", "openpyxl>=3.1.0", "xlrd>=2.0.0", "lxml>=5.0.0"]

# === UTILITIES ===
tiktoken = ["tiktoken>=0.7.0,<1.0.0"]

# === CONVENIENCE BUNDLES ===
default = ["embedchain[openai,chromadb]"]
llms = ["embedchain[openai,anthropic,cohere,google,mistral,together,ollama,aws,vertexai,groq]"]
vectorstores = ["embedchain[chromadb,pinecone,qdrant,weaviate,elasticsearch,opensearch,milvus,lancedb,postgres,mysql]"]
loaders = ["embedchain[audio,youtube,github,slack,discord,dropbox,google-services,unstructured]"]
all = ["embedchain[llms,vectorstores,loaders,huggingface,opensource,tiktoken]"]

[project.scripts]
ec = "embedchain.cli:cli"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "click>=8.1.3,<9.0.0",
    "responses>=0.25.0,<1.0.0",
    "mock>=5.1.0,<6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["embedchain"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "E", "F", "I", "B", "UP", "RUF"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E722",   # bare except (existing code)
    "B004",   # unreliable callable check
    "B007",   # unused loop control variable
    "B008",   # function call in default argument
    "B011",   # assert false
    "B018",   # useless expression
    "B024",   # abstract class without abstract methods
    "B028",   # no explicit stacklevel
    "B904",   # raise from err (too noisy for existing codebase)
    "B905",   # zip without explicit strict
    "C401",   # unnecessary generator set
    "RUF005", # collection literal concatenation
    "RUF012", # mutable class default
    "RUF013", # implicit optional
    "RUF015", # unnecessary iterable allocation
    "RUF034", # useless if-else
    "RUF043", # pytest raises ambiguous pattern
    "SIM105", # use contextlib.suppress
    "SIM108", # use ternary
    "SIM115", # use context manager for open
    "SIM117", # combine with statements
    "UP028",  # yield in for loop
    "UP031",  # printf string formatting
    "UP036",  # outdated version block
    "UP045",  # non-pep604 optional annotation
    "UP047",  # non-pep695 generic function
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"embedchain/__init__.py" = ["E401"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
markers = [
    "external_service: tests requiring external API services (Dropbox, Slack, YouTube, GitHub, Gmail, Google Drive, Notion)",
    "llm_provider: tests requiring specific LLM provider API keys (OpenAI, Anthropic, Cohere, Vertex AI, etc.)",
    "vectordb: tests requiring vector database setup (Pinecone, Weaviate, Qdrant, Elasticsearch, etc.)",
    "slow: long-running tests",
]
# Skip external service and LLM provider tests by default in CI
addopts = "-m 'not external_service and not llm_provider'"
