[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embedchain"
version = "0.1.128"
description = "Simplest open source retrieval (RAG) framework"
authors = [
    { name = "Taranjeet Singh", email = "taranjeet@embedchain.ai" },
    { name = "Deshraj Yadav", email = "deshraj@embedchain.ai" },
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.9,<3.14"
dependencies = [
    "python-dotenv>=1.0.0,<2.0.0",
    "langchain>=0.3.1,<1.0.0",
    "requests>=2.31.0,<3.0.0",
    "openai>=1.1.1",
    "chromadb>=0.5.10,<1.0.0",
    "posthog>=3.0.2,<4.0.0",
    "rich>=13.7.0,<14.0.0",
    "beautifulsoup4>=4.12.2,<5.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "gptcache>=0.1.43,<1.0.0",
    "pysbd>=0.3.4,<1.0.0",
    "mem0ai>=1.0.0,<2.0.0",
    "schema>=0.7.5,<1.0.0",
    "langchain-openai>=0.2.1,<1.0.0",
    "sqlalchemy>=2.0.27,<3.0.0",
    "alembic>=1.13.1,<2.0.0",
    "langchain-cohere>=0.3.0,<1.0.0",
    "langchain-community>=0.3.1,<1.0.0",
    "langsmith>=0.3.18,<1.0.0",
]

[project.optional-dependencies]
opensource = [
    "sentence-transformers>=5.0.0,<6.0.0",
    "torch>=2.3.0,<3.0.0",
    "gpt4all>=2.0.2,<3.0.0",
]
lancedb = ["lancedb>=0.6.2,<1.0.0"]
elasticsearch = ["elasticsearch>=8.9.0,<9.0.0"]
opensearch = ["opensearch-py>=2.3.1,<3.0.0"]
weaviate = ["weaviate-client>=4.4.0,<4.15.0"]
qdrant = ["qdrant-client>=1.6.3,<2.0.0"]
together = ["together>=1.2.1,<2.0.0"]
milvus = ["pymilvus>=2.4.3,<3.0.0"]
vertexai = ["langchain-google-vertexai>=2.0.2,<3.0.0"]
llama2 = ["replicate>=0.15.4,<1.0.0"]
gmail = [
    "requests>=2.31.0,<3.0.0",
    "google-api-python-client>=2.111.0,<3.0.0",
    "google-auth>=2.25.2,<3.0.0",
    "google-auth-oauthlib>=1.2.0,<2.0.0",
    "google-auth-httplib2>=0.2.0,<1.0.0",
    "google-api-core>=2.15.0,<3.0.0",
]
googledrive = [
    "google-api-python-client>=2.111.0,<3.0.0",
    "google-auth-oauthlib>=1.2.0,<2.0.0",
    "google-auth-httplib2>=0.2.0,<1.0.0",
]
postgres = [
    "psycopg>=3.1.12,<4.0.0",
    "psycopg-binary>=3.1.12,<4.0.0",
    "psycopg-pool>=3.1.8,<4.0.0",
]
mysql = ["mysql-connector-python>=8.1.0,<9.0.0"]
google = ["google-generativeai>=0.3.0,<1.0.0"]
mistralai = ["langchain-mistralai>=0.2.0,<1.0.0"]
aws = ["langchain-aws>=0.2.1,<1.0.0"]
cohere = ["cohere>=5.3,<6.0.0"]
tiktoken = ["tiktoken>=0.7.0,<1.0.0"]

[project.scripts]
ec = "embedchain.cli:cli"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "click>=8.1.3,<9.0.0",
    "responses>=0.25.0,<1.0.0",
    "mock>=5.1.0,<6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["embedchain"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["ASYNC", "E", "F", "I", "B", "UP"]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"embedchain/__init__.py" = ["E401"]

[tool.ruff.lint.mccabe]
max-complexity = 10
