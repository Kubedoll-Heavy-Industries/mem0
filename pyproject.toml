[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["server", "openmemory/api", "embedchain"]

[tool.uv.sources]
# Use local mem0ai for workspace members
mem0ai = { workspace = true }

[project]
name = "mem0ai"
version = "1.0.0"
description = "Long-term memory for AI Agents"
authors = [
    { name = "Mem0", email = "founders@mem0.ai" }
]
maintainers = [
    { name = "Cadence Agyirey", email = "8145742+cagyirey@users.noreply.github.com" }
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
dependencies = [
    "qdrant-client>=1.9.1",
    "pydantic>=2.7.3",
    "openai>=2.0.0",
    "posthog>=3.5.0,<6.0.0",  # chromadb requires <6.0.0
    "pytz>=2024.1",
    "sqlalchemy>=2.0.31",
    "protobuf>=5.29.0,<6.0.0",
]

[project.optional-dependencies]
graph = [
    "langchain-neo4j>=0.5.0",
    "langchain-aws>=1.0.0",
    "langchain-memgraph>=0.1.0",  # Latest is 0.1.12
    "neo4j>=5.23.1",
    "rank-bm25>=0.2.2",
    "kuzu>=0.11.0",
]
vector_stores = [
    "vecs>=0.4.0",
    "chromadb>=1.4.0,<2.0.0",
    "cassandra-driver>=3.29.0",
    "weaviate-client>=4.19.0,<5.0.0",
    "pinecone>=8.0.0,<9.0.0",
    "pinecone-text>=0.10.0",
    "faiss-cpu>=1.7.4",
    "upstash-vector>=0.1.0",
    "azure-search-documents>=11.4.0b8",
    "psycopg>=3.2.8",
    "psycopg-pool>=3.2.6,<4.0.0",
    "pymongo>=4.13.2",
    "pymochow>=2.2.9",
    "pymysql>=1.1.0",
    "dbutils>=3.0.3",
    "valkey>=6.0.0",
    "databricks-sdk>=0.63.0",
    "azure-identity>=1.24.0",
    "redis>=5.0.0,<6.0.0",
    "redisvl>=0.1.0,<1.0.0",
    "elasticsearch>=9.0.0,<10.0.0",
    "pymilvus>=2.6.0,<3.0.0",
    "langchain-aws>=1.0.0",
]
llms = [
    "groq>=0.3.0",
    "together>=0.2.10",
    "litellm>=1.74.0",
    "openai>=2.0.0",
    "ollama>=0.1.0",
    "vertexai>=0.1.0",
    "google-generativeai>=0.3.0",
    "google-genai>=1.0.0",
]
extras = [
    "boto3>=1.34.0",
    "langchain>=1.0.0,<2.0.0",
    "langchain-community>=0.4.0,<2.0.0",
    "sentence-transformers>=5.0.0",
    "elasticsearch>=9.0.0,<10.0.0",
    "opensearch-py>=3.0.0,<4.0.0",
    "fastembed>=0.3.1",
]

[dependency-groups]
test = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
]
dev = [
    "ruff>=0.14.0",
    "ty>=0.0.1a0",
    "pre-commit>=4.0.0",
    "nox>=2025.0.0",
    { include-group = "test" },
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
timeout = 300
markers = [
    "azure: tests requiring azure SDK",
    "groq: tests requiring groq SDK",
    "together: tests requiring together SDK",
    "ollama: tests requiring ollama",
    "litellm: tests requiring litellm",
    "langchain: tests requiring langchain ecosystem",
    "chromadb: tests requiring chromadb",
    "elasticsearch: tests requiring elasticsearch",
    "opensearch: tests requiring opensearch",
    "pinecone: tests requiring pinecone",
    "milvus: tests requiring pymilvus",
    "redis: tests requiring redis",
    "weaviate: tests requiring weaviate",
    "neo4j: tests requiring neo4j",
    "vertexai: tests requiring vertexai",
    "gemini: tests requiring google generativeai",
    "anthropic: tests requiring anthropic SDK",
    "graph: tests requiring graph dependencies",
    "integration: integration tests requiring external services",
]

[tool.hatch.build]
include = [
    "mem0/**/*.py",
]
exclude = [
    "**/*",
    "!mem0/**/*.py",
]

[tool.hatch.build.targets.wheel]
packages = ["mem0"]
only-include = ["mem0"]

[tool.hatch.build.targets.wheel.shared-data]
"README.md" = "README.md"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "cookbooks/",
    "docs/",
    "evaluation/",
    "examples/",
    "mem0-ts/",
    "vercel-ai-sdk/",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E722",   # bare except (existing code)
    "B004",   # unreliable callable check
    "B007",   # unused loop control variable
    "B008",   # function call in default argument
    "B011",   # assert false
    "B018",   # useless expression
    "B024",   # abstract class without abstract methods
    "B028",   # no explicit stacklevel
    "B904",   # raise from err (too noisy for existing codebase)
    "B905",   # zip without explicit strict
    "C401",   # unnecessary generator set
    "F811",   # redefined while unused
    "RUF001", # ambiguous unicode (intentional for CJK support)
    "RUF012", # mutable class attributes (ClassVar annotations)
    "RUF013", # implicit optional
    "RUF034", # useless if-else
    "SIM105", # use contextlib.suppress (style preference)
    "SIM108", # use ternary (style preference)
    "SIM115", # use context manager for open (style preference)
    "SIM117", # combine with statements (style preference)
    "UP028",  # yield in for loop
    "UP031",  # printf string formatting
    "UP045",  # non-pep604 optional annotation
]

[tool.ruff.lint.isort]
known-first-party = ["mem0"]

[tool.coverage.run]
source = ["mem0"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
