[project]
name = "openmemory-api"
version = "1.0.0"
description = "OpenMemory API - self-hosted memory layer"
requires-python = ">=3.10,<3.15"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "alembic>=1.13.0,<2.0.0",
    "psycopg[binary,pool]>=3.2.0,<4.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "fastapi-pagination>=0.12.0,<1.0.0",
    "mem0ai>=1.0.0,<2.0.0",
    "openai>=2.0.0,<3.0.0",
    "mcp[cli]>=1.3.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "anthropic>=0.40.0,<1.0.0",
    "ollama>=0.4.0,<1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "ty>=0.0.1a0",
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
]
