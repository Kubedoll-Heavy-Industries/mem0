version: 2
updates:
  # Python (uv/pip ecosystem)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    groups:
      python-minor:
        update-types: [minor, patch]

  # TypeScript/npm packages
  - package-ecosystem: npm
    directory: /mem0-ts
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /vercel-ai-sdk
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: [minor, patch]

  # GitHub Actions - use SHA pinning for supply chain security
  # Dependabot will update SHA-pinned actions automatically
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    groups:
      actions-minor:
        update-types: [minor, patch]

  # Docker base images
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

