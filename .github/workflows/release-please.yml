name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      mem0ai--release_created: ${{ steps.release.outputs['.'--release_created] }}
      mem0ai--tag_name: ${{ steps.release.outputs['.'--tag_name] }}
      embedchain--release_created: ${{ steps.release.outputs['embedchain--release_created'] }}
      embedchain--tag_name: ${{ steps.release.outputs['embedchain--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summary
        run: |
          echo "## Release Please Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.release.outputs.releases_created }}" == "true" ]; then
            echo "✅ Releases were created" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Package | Tag |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
            if [ -n "${{ steps.release.outputs['.'--tag_name] }}" ]; then
              echo "| mem0ai | ${{ steps.release.outputs['.'--tag_name] }} |" >> $GITHUB_STEP_SUMMARY
            fi
            if [ -n "${{ steps.release.outputs['embedchain--tag_name'] }}" ]; then
              echo "| embedchain | ${{ steps.release.outputs['embedchain--tag_name'] }} |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "ℹ️ No releases created (Release PR may be pending)" >> $GITHUB_STEP_SUMMARY
          fi
