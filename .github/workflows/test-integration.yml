name: Integration Tests

on:
  push:
    branches: [main, cagyirey/main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OLLAMA_LLM_MODEL: smollm:135m
  OLLAMA_EMBED_MODEL: all-minilm:22m

jobs:
  test-mem0-ts:
    name: mem0-ts / testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: mem0-ts/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: mem0-ts
        run: pnpm install --frozen-lockfile

      # Setup host Ollama with model caching
      - uses: ollama/setup-ollama@v1

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_LLM_MODEL }}-${{ env.OLLAMA_EMBED_MODEL }}

      - name: Pull Ollama models
        run: |
          ollama pull "$OLLAMA_LLM_MODEL"
          ollama pull "$OLLAMA_EMBED_MODEL"

      - name: Run integration tests
        working-directory: mem0-ts
        run: pnpm test:integration
        env:
          OLLAMA_HOST: http://localhost:11434
          TESTCONTAINERS_RYUK_DISABLED: "true"
