name: Integration Tests

on:
  push:
    branches: [main, cagyirey/main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OLLAMA_LLM_MODEL: smollm:135m
  OLLAMA_EMBED_MODEL: all-minilm:22m

jobs:
  test-mem0-ts:
    name: mem0-ts / testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: mem0-ts/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: mem0-ts/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: mem0-ts
        run: pnpm install --frozen-lockfile

      # Use testcontainers for all services including Ollama
      # Models are pulled inside the container - no host setup needed
      - name: Run integration tests
        working-directory: mem0-ts
        run: pnpm test:integration
        env:
          # Model names for testcontainers to pull
          OLLAMA_LLM_MODEL: ${{ env.OLLAMA_LLM_MODEL }}
          OLLAMA_EMBED_MODEL: ${{ env.OLLAMA_EMBED_MODEL }}
          TESTCONTAINERS_RYUK_DISABLED: "true"
