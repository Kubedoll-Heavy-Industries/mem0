name: Release

on:
  push:
    tags:
      - "v*"                        # Legacy: v1.0.0
      - "mem0ai-v*"                 # release-please: mem0ai-v1.0.2
      - "embedchain-v*"             # release-please: embedchain-v0.1.129
      - "mem0-ts-v*"                # release-please: mem0-ts-v2.1.39
      - "vercel-ai-provider-v*"        # release-please: vercel-ai-provider-v2.1.0
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Release target"
        required: true
        type: choice
        options:
          - all
          - packages
          - docker
      package:
        description: "Package to build (ignored for docker-only)"
        required: false
        type: choice
        default: both
        options:
          - mem0ai
          - embedchain
          - both
      dry_run:
        description: "Dry run (don't actually publish)"
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io

jobs:
  # ===========================================================================
  # Build Python packages
  # ===========================================================================
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'packages'
    strategy:
      matrix:
        package: ${{ github.event_name == 'workflow_dispatch' && inputs.package != 'both' && fromJson(format('["{0}"]', inputs.package)) || fromJson('["mem0ai", "embedchain"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build mem0ai
        if: matrix.package == 'mem0ai'
        run: uv build

      - name: Build embedchain
        if: matrix.package == 'embedchain'
        run: uv build --package embedchain

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.package }}
          path: dist/

  # ===========================================================================
  # Build TypeScript packages
  # ===========================================================================
  build-ts:
    name: Build TypeScript packages
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'packages'
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: |
            mem0-ts/pnpm-lock.yaml
            vercel-ai-sdk/pnpm-lock.yaml

      - name: Build mem0-ts
        working-directory: mem0-ts
        run: |
          pnpm install
          pnpm run build
          pnpm pack

      - name: Build vercel-ai-sdk
        working-directory: vercel-ai-sdk
        run: |
          pnpm install
          pnpm run build
          pnpm pack

      - name: Upload mem0-ts artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-mem0-ts
          path: mem0-ts/*.tgz

      - name: Upload vercel-ai-sdk artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-vercel-ai-sdk
          path: vercel-ai-sdk/*.tgz

  # ===========================================================================
  # Upload packages as GitHub Release assets
  # ===========================================================================
  upload-release-assets:
    name: Upload Release Assets
    needs: [build, build-ts]
    runs-on: ubuntu-latest
    # Only upload to releases (not manual dispatch unless explicitly releasing)
    if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: dist-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false

  # ===========================================================================
  # Build and publish Docker image to GHCR
  # ===========================================================================
  docker:
    name: Docker
    runs-on: ubuntu-latest
    # Only build Docker for mem0ai releases (not embedchain) or manual dispatch
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'docker')) ||
      (github.event_name == 'release') ||
      (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/mem0ai-v')))
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version and namespace
        id: meta
        run: |
          # Extract version from tag (e.g., v1.0.0 -> 1.0.0, mem0ai-v1.0.0 -> 1.0.0)
          VERSION="${GITHUB_REF_NAME#*-v}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION:-dev}" >> "$GITHUB_OUTPUT"
          # Docker requires lowercase repository names
          echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker images
        uses: docker/bake-action@v6
        with:
          targets: all
          push: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp || github.event.release.created_at || '' }}
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_NAMESPACE: ${{ steps.meta.outputs.namespace }}
          OCI_SOURCE: https://github.com/${{ github.repository }}
          OCI_URL: https://github.com/${{ github.repository }}
          OCI_VENDOR: Kubedoll Heavy Industries
          OCI_AUTHORS: Cadence Agyirey <8145742+cagyirey@users.noreply.github.com>

      # TODO: Attestation for multi-image bake builds requires iterating over outputs
      # See: https://docs.docker.com/build/bake/reference/#output
      # - name: Generate artifact attestation
      #   uses: actions/attest-build-provenance@v3
