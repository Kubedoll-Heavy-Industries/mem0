name: Release

on:
  push:
    tags:
      - "mem0ai-v*"                 # release-please: mem0ai-v1.0.2
      - "embedchain-v*"             # release-please: embedchain-v0.1.129
      - "mem0-ts-v*"                # release-please: mem0-ts-v2.1.39
      - "vercel-ai-provider-v*"     # release-please: vercel-ai-provider-v2.1.0
  workflow_dispatch:
    inputs:
      target:
        description: "Release target"
        required: true
        type: choice
        options:
          - all
          - mem0ai
          - embedchain
          - mem0-ts
          - vercel-ai-provider
          - docker
      dry_run:
        description: "Dry run (don't actually publish)"
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io

jobs:
  # ===========================================================================
  # Build Python: mem0ai
  # ===========================================================================
  build-mem0ai:
    name: Build mem0ai
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mem0ai-v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'mem0ai'))
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build mem0ai
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-mem0ai
          path: dist/

  # ===========================================================================
  # Build Python: embedchain
  # ===========================================================================
  build-embedchain:
    name: Build embedchain
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/embedchain-v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'embedchain'))
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build embedchain
        run: uv build --package embedchain

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-embedchain
          path: dist/

  # ===========================================================================
  # Build TypeScript: mem0-ts
  # ===========================================================================
  build-mem0-ts:
    name: Build mem0-ts
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mem0-ts-v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'mem0-ts'))
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: mem0-ts/pnpm-lock.yaml

      - name: Build mem0-ts
        working-directory: mem0-ts
        run: |
          pnpm install
          pnpm run build
          pnpm pack

      - name: Upload mem0-ts artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-mem0-ts
          path: mem0-ts/*.tgz

  # ===========================================================================
  # Build TypeScript: vercel-ai-provider
  # ===========================================================================
  build-vercel-ai:
    name: Build vercel-ai-provider
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/vercel-ai-provider-v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'vercel-ai-provider'))
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: vercel-ai-sdk/pnpm-lock.yaml

      - name: Build vercel-ai-sdk
        working-directory: vercel-ai-sdk
        run: |
          pnpm install
          pnpm run build
          pnpm pack

      - name: Upload vercel-ai-sdk artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-vercel-ai-sdk
          path: vercel-ai-sdk/*.tgz

  # ===========================================================================
  # Upload packages as GitHub Release assets
  # ===========================================================================
  upload-release-assets:
    name: Upload Release Assets
    needs: [build-mem0ai, build-embedchain, build-mem0-ts, build-vercel-ai]
    if: always() && !cancelled() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: dist-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/ || echo "No artifacts"

      - name: Upload to GitHub Release
        if: hashFiles('dist/*') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false

  # ===========================================================================
  # Build and publish Docker image to GHCR
  # ===========================================================================
  docker:
    name: Docker
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mem0ai-v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'mem0ai' || inputs.target == 'docker'))
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version and namespace
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#*-v}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION:-dev}" >> "$GITHUB_OUTPUT"
          echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker images
        uses: docker/bake-action@v6
        with:
          targets: all
          push: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp || github.event.release.created_at || '' }}
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_NAMESPACE: ${{ steps.meta.outputs.namespace }}
          OCI_SOURCE: https://github.com/${{ github.repository }}
          OCI_URL: https://github.com/${{ github.repository }}
          OCI_VENDOR: Kubedoll Heavy Industries
          OCI_AUTHORS: Cadence Agyirey <8145742+cagyirey@users.noreply.github.com>
